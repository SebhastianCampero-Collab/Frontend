<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/guardian.svg" />
    <meta name="theme-color" content="#F9F9F9" />
    <script>
      // Apply the saved appearance before the first paint. Light remains the default.
      try {
        document.documentElement.dataset.theme = localStorage.getItem('devguardian.theme') === 'dark' ? 'dark' : 'light';
      } catch { document.documentElement.dataset.theme = 'light'; }
    </script>
    <meta
      name="description"
      content="DevGuardian: auditoría, reparación verificada y trazabilidad de código con MCP."
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevGuardian Frontend</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
